name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          # Demo mode - no Supabase secrets needed
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://demo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'demo-key' }}
          DEMO_LOGIN_ENABLED: 'true'
          DEMO_DATA_ENABLED: 'true'
          DEMO_CLIENT_PRESET: 'clinic'
          DEMO_SESSION_SECRET: ${{ secrets.DEMO_SESSION_SECRET || 'a-very-long-secret-key-for-demo-purposes-only-32-chars-min' }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD || 'demo-admin-password' }}
          DEMO_STAFF_PASSWORD: ${{ secrets.DEMO_STAFF_PASSWORD || 'demo-staff-password' }}